{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:420px;margin:0 auto">
  <h2>Login</h2>
  <form method="post">
    <label>Phone number</label><input name="phone" required>
    <label>Password</label><input type="password" name="password" required>
    <p><button>Login</button></p>
  </form>
  <p class="muted">New here? <a href="{{ url_for('register', role='donor') }}">Register as donor</a> or
     <a href="{{ url_for('register', role='receiver') }}">register as receiver</a>.</p>
</div>
{% endblock %}
