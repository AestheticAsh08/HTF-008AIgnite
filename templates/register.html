{% extends "base.html" %}
{% block body %}
<h2>Register as {{ 'a donor' if role == 'donor' else 'a receiver' }}</h2>
<form method="post" class="grid2">
  <div class="card">
    <label>{{ 'Your / organisation name' if role == 'donor' else 'Organisation name' }}</label>
    <input name="name" required value="{{ form.get('name','') }}">
    <label>Type</label>
    <select name="org_type">
      {% if role == 'donor' %}
        {% for t in ['Wedding hall / event venue','Caterer','Restaurant','Hostel / canteen mess','Event organizer','Individual'] %}
          <option {{ 'selected' if form.get('org_type') == t }}>{{ t }}</option>{% endfor %}
      {% else %}
        {% for t in ['Orphanage','Old-age home','Shelter','Community kitchen','School / hostel','Other charity'] %}
          <option {{ 'selected' if form.get('org_type') == t }}>{{ t }}</option>{% endfor %}
      {% endif %}
    </select>
    <label>Phone number (used to login)</label>
    <input name="phone" required value="{{ form.get('phone','') }}">
    <label>Password</label>
    <input type="password" name="password" required>
    {% if role == 'receiver' %}
      <label>How many portions can you take at a time?</label>
      <input type="number" name="capacity" min="1" value="{{ form.get('capacity','') }}">
      <label>What food can you accept?</label>
      <select name="diet">
        {% for k, v in diets.items() %}<option value="{{ k }}" {{ 'selected' if form.get('diet','veg') == k }}>{{ v }}</option>{% endfor %}
      </select>
    {% endif %}
    <label>Address</label>
    <textarea name="address" id="addr" required>{{ form.get('address','') }}</textarea>
    <input type="hidden" name="lat" id="lat" value="{{ form.get('lat','') }}">
    <input type="hidden" name="lng" id="lng" value="{{ form.get('lng','') }}">
    <p><button>Create account</button></p>
  </div>
  <div class="card">
    <h3>Pin your location</h3>
    <p class="muted">Search a place, use GPS, or click the map. You can drag the marker to adjust it.</p>
    <div class="row">
      <input class="grow" id="q" placeholder="Search e.g. your street, landmark, town">
      <button type="button" id="sb" class="sec">Search</button>
      <button type="button" id="gb" class="sec">Use my location</button>
    </div>
    <div id="map" class="map" style="margin-top:10px"></div>
  </div>
</form>
<script>
  var lat0=parseFloat(document.getElementById('lat').value), lng0=parseFloat(document.getElementById('lng').value);
  initPicker({mapId:'map',latId:'lat',lngId:'lng',addrId:'addr',searchInput:'q',searchBtn:'sb',gpsBtn:'gb',
    initial:(isNaN(lat0)||isNaN(lng0))?null:[lat0,lng0]});
</script>
{% endblock %}
